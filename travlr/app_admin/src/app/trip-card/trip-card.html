<article class="card h-100 shadow-sm">
  <img class="card-img-top trip-image" [src]="'/images/' + trip().image" [alt]="trip().name">
  <div class="card-body d-flex flex-column">
    <div class="d-flex justify-content-between align-items-start gap-2">
      <h2 class="h5 card-title">{{ trip().name }}</h2><span class="badge text-bg-light">{{ trip().length }}</span>
    </div>
    <p class="trip-code">{{ trip().code }}</p>
    <p class="mb-1">{{ trip().resort }}</p>
    <p class="text-secondary small">Departs {{ trip().start | date:'MMM d, yyyy':'UTC' }}</p>
    <div class="description small mb-3" [innerHTML]="trip().description"></div>
    <div class="mt-auto">
      <p class="fw-semibold">{{ trip().perPerson }} <span class="text-secondary fw-normal small">per person</span></p>
      @if (auth.isAdmin()) { <div class="d-flex gap-2">
        <a class="btn btn-primary flex-grow-1" [routerLink]="['/trips', trip().code, 'edit']">Edit trip</a>
        <button class="btn btn-outline-danger" [disabled]="deleting()" (click)="remove.emit(trip())">Delete</button>
      </div> }
    </div>
  </div>
</article>
